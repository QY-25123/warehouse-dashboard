services:

  # ── FastAPI backend ─────────────────────────────────────────────────────────
  backend:
    build:
      context: .                        # project root — Dockerfile COPYs schema.sql/seed.sql
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env                  # loads DATABASE_URL, Supabase keys, Telegram, Anthropic
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    depends_on:
      - phoenix

  # ── Arize Phoenix — LLM tracing/observability UI + OTLP collector ────────────
  # Self-hosted for local/dev use. In production you can instead point
  # PHOENIX_COLLECTOR_ENDPOINT (in backend/.env) at Phoenix Cloud
  # (https://phoenix.arize.com) and drop this service.
  phoenix:
    image: arizephoenix/phoenix:latest
    restart: unless-stopped
    ports:
      - "6006:6006"   # Phoenix UI
      - "4317:4317"   # OTLP gRPC collector — backend sends traces here
    volumes:
      - phoenix_data:/mnt/data
    environment:
      - PHOENIX_WORKING_DIR=/mnt/data

volumes:
  phoenix_data:

